# =============================================================================
# The entire developer experience. Ten lines. No Deployment, no Service,
# no PVC, no Prometheus annotations, no Argo. The developer never sees KRM.
# This same file applies identically on kind, EKS, GKE, and AKS.
# =============================================================================
apiVersion: kro.run/v1alpha1
kind: GenAIService
metadata:
  name: sentiment-api
spec:
  name: sentiment-api
  model: "Qwen/Qwen2.5-0.5B-Instruct"
  # 1, not 2: the replicas share one ReadWriteOnce cache PVC, which attaches to
  # a single node. Two replicas work on single-node kind and deadlock on a real
  # multi-node cluster (Multi-Attach). Raise this only with RWX storage.
  replicas: 1
  monitoring: true
