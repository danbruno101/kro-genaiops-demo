# =============================================================================
# kind (laptop) platform config (platform-team owned) — a single KRO-owned object.
# -----------------------------------------------------------------------------
# The base single-cluster demo (scripts/setup.sh) runs on kind. The GenAIService
# RGD requires the genaiops-platform-config ConfigMap to exist before any
# GenAIService reconciles, so a ClusterPlatform instance ships one here too.
#
# storageClass names kind's built-in `standard` class explicitly and
# manageStorageClass is false (kind ships it; nothing extra is created, KRO just
# owns the ConfigMap). It must NOT be empty: the GenAIService RGD writes this
# value into each replica's ephemeral volumeClaimTemplate, and an empty
# storageClassName there means "no class" — the PVCs would never bind. There is
# no "inherit the cluster default" rung any more; every environment names its
# class here.
# =============================================================================
apiVersion: kro.run/v1alpha1
kind: ClusterPlatform
metadata:
  name: cluster-platform
spec:
  cloud: kind
  storageClass: standard
  manageStorageClass: false
