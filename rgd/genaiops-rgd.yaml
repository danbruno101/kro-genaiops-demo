# =============================================================================
# GenAIOps ResourceGraphDefinition
# -----------------------------------------------------------------------------
# This is the PLATFORM TEAM's artifact. Authored once, applied once per cluster.
# It defines a new cluster-wide API: kind "GenAIService" (group kro.run).
#
# The portability thesis: this exact file applies unchanged on kind, EKS, GKE,
# AKS, or bare metal. The only thing that varies per environment is which
# storageClass / accelerator the developer (or a default) selects -- and that
# is exposed as a *field*, not hardcoded into manifests. No rewrites, no
# environment-specific templating, no Go operator.
# =============================================================================
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: genaiservice.kro.run
spec:
  # --- The API surface developers see (SimpleSchema) -------------------------
  schema:
    apiVersion: v1alpha1
    kind: GenAIService
    spec:
      # Required: human-facing knobs only. Everything else is platform default.
      name: string
      model: string | default="Qwen/Qwen2.5-0.5B-Instruct"
      # Replicas of the serving deployment. Scale freely: every replica gets its
      # OWN model-cache disk (a generic ephemeral volume, one ReadWriteOnce PVC
      # per pod), so replicas land on different nodes without the Multi-Attach
      # deadlock a shared RWO claim would cause. The trade-off: the cache is
      # tied to the pod. A replica that is rescheduled, rolled, or scaled away
      # starts with an empty cache and re-downloads the model. The pod's own
      # restarts (same pod, container crash) keep the disk.
      replicas: integer | default=1
      # "mock" runs anywhere (CPU, zero GPU). "gpu" requests an accelerator.
      # This single field is the whole portability story on stage.
      mode: string | default="mock"
      # Storage size of EACH replica's model-cache disk.
      cacheSize: string | default="8Gi"
      # Optional developer override. Empty (the default) defers to the platform
      # team's per-cluster choice in the genaiops-platform-config ConfigMap.
      # One of the two MUST name a class: see the storage note on the
      # Deployment below.
      storageClass: string | default=""
      # Toggle Prometheus scraping wiring on/off.
      monitoring: boolean | default=true
    status:
      # Surfaced back onto the GenAIService object for `kubectl get`.
      endpoint: '${service.spec.clusterIP}'
      readyReplicas: '${deployment.status.readyReplicas}'
      # NOT named `conditions`: kro reserves status.conditions for the instance's
      # own conditions and, since v0.9.3, rejects a graph that declares it as
      # anything but a list ("status.conditions must be a list, got string").
      # kro <= 0.9.2 accepted the collision silently but shadowed kro's own
      # conditions; with this name they surface correctly on both versions.
      #
      # UPGRADING AN EXISTING CLUSTER: renaming a status field changes the
      # generated CRD, and kro refuses breaking CRD updates ("KindReady: False,
      # breaking changes detected"). Delete the generated CRD and the RGD, then
      # re-apply -- instances of the kind go with it, so re-apply those too:
      #   kubectl delete genaiservice --all
      #   kubectl delete rgd genaiservice.kro.run
      #   kubectl delete crd genaiservices.kro.run
      #   kubectl apply -f rgd/genaiops-rgd.yaml
      # Fresh clusters (scripts/setup.sh) are unaffected. ADDING a status field
      # (like cacheStorageClasses below) is additive and applies in place.
      deploymentConditions: '${deployment.status.conditions}'
      # The StorageClass of every per-replica cache disk, read back from the
      # live PVCs (the modelCaches collection below), sorted by claim name so
      # the value is stable. Two replicas -> "premium-rwo,premium-rwo". This is
      # the proof that kro resolved the cloud's class into each replica's disk.
      cacheStorageClasses: '${modelCaches.sortBy(c, c.metadata.name).map(c, c.spec.?storageClassName.orValue("")).join(",")}'

  # --- The resources the single API expands into -----------------------------
  # kro builds the resource graph from these definitions and writes the
  # GenAIService status back from the live Service/Deployment (see schema.status).
  #
  # Note on the model cache: there is NO standalone PVC resource in this graph.
  # The Deployment's pod template declares a generic ephemeral volume
  # (volumes[].ephemeral.volumeClaimTemplate), so Kubernetes stamps one
  # ReadWriteOnce PVC per pod, named <pod>-cache, owned by that pod and deleted
  # with it. Replicas therefore never share a disk and can schedule on any node.
  # kro still decides WHICH StorageClass each disk uses -- the template below
  # folds the per-cluster value in -- and reads the resulting claims back via
  # the modelCaches collection for status.
  resources:
    # 0) Platform config (READ-ONLY external reference, one per cluster). It is
    #    created by KRO from a ClusterPlatform instance (rgd/platform-rgd.yaml +
    #    clouds/<cloud>/platform.yaml) -- THIS RGD only READS it and never
    #    creates/owns it. It is how KRO -- not the Kubernetes default-StorageClass
    #    mechanism -- resolves the per-cluster storage choice: the SAME RGD and the
    #    SAME instance apply on every cloud, and this object supplies the
    #    environment-specific value. The ConfigMap must exist before a GenAIService
    #    reconciles (the setup/deploy scripts apply the ClusterPlatform instance
    #    first and wait for it), and its storageClass must NOT be empty (see the
    #    storage note on the Deployment).
    - id: platformConfig
      externalRef:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: genaiops-platform-config

    # 1) The serving Deployment (vLLM-compatible interface).
    #
    #    STORAGE: the model cache is a generic ephemeral volume, one PVC per pod.
    #    The effective StorageClass is resolved by KRO with this precedence:
    #      1. the developer's instance override (schema.spec.storageClass), else
    #      2. the platform team's per-cluster value (platformConfig.data.storageClass).
    #    There is deliberately NO third rung that inherits the cluster default.
    #    A pod template cannot omit storageClassName conditionally (kro's omit()
    #    is alpha and feature-gated), and storageClassName: "" means "no class"
    #    -- Kubernetes disables dynamic provisioning and the PVCs sit Pending
    #    forever. So every environment names its class: kind's ClusterPlatform
    #    writes `standard`, the cloud ones write premium-rwo / managed-csi / gp3.
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: '${schema.spec.name}'
          labels:
            app: '${schema.spec.name}'
            app.kubernetes.io/managed-by: kro
            genaiops.kro.run/service: '${schema.spec.name}'
        spec:
          replicas: '${schema.spec.replicas}'
          # RollingUpdate is safe here: no two pods ever share a disk, so a new
          # pod can come up on any node while the old one is still serving. (The
          # shared-RWO design this replaced needed Recreate to avoid a
          # Multi-Attach error between the outgoing and incoming pod.)
          strategy:
            type: RollingUpdate
          selector:
            matchLabels:
              app: '${schema.spec.name}'
          template:
            metadata:
              labels:
                app: '${schema.spec.name}'
                genaiops.kro.run/service: '${schema.spec.name}'
              annotations:
                prometheus.io/scrape: '${schema.spec.monitoring ? "true" : "false"}'
                prometheus.io/port: "8000"
                prometheus.io/path: "/metrics"
            spec:
              # Spread replicas across nodes when the cluster has them; on a
              # single-node kind cluster ScheduleAnyway lets them co-locate.
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                    matchLabels:
                      app: '${schema.spec.name}'
              containers:
                - name: server
                  # mock mode: a tiny OpenAI-compatible stub that also emits
                  # Prometheus metrics on :8000/metrics. gpu mode: swap to vLLM.
                  image: '${schema.spec.mode == "gpu" ? "vllm/vllm-openai:latest" : "ghcr.io/danbruno101/mock-vllm:demo"}'
                  args: '${schema.spec.mode == "gpu" ? ["--model", schema.spec.model] : ["--model", schema.spec.model, "--mock"]}'
                  ports:
                    - name: http
                      containerPort: 8000
                  env:
                    - name: MODEL_NAME
                      value: '${schema.spec.model}'
                    - name: SERVICE_NAME
                      value: '${schema.spec.name}'
                  resources:
                    requests:
                      cpu: '${schema.spec.mode == "gpu" ? "2" : "100m"}'
                      memory: '${schema.spec.mode == "gpu" ? "8Gi" : "128Mi"}'
                    # CEL conditional adds the GPU request ONLY in gpu mode.
                    limits: '${schema.spec.mode == "gpu" ? {"nvidia.com/gpu": "1"} : {}}'
                  volumeMounts:
                    - name: cache
                      mountPath: /root/.cache
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 8000
                    initialDelaySeconds: 3
                    periodSeconds: 5
              volumes:
                # Per-replica model cache. Kubernetes creates one PVC per pod
                # from this template (named <pod>-cache, labelled app=<name>
                # so the modelCaches collection below can find them) and
                # deletes it with the pod. The StorageClass is the KRO-resolved
                # per-cluster value -- the whole portability story in one line.
                - name: cache
                  ephemeral:
                    volumeClaimTemplate:
                      metadata:
                        labels:
                          app: '${schema.spec.name}'
                          genaiops.kro.run/service: '${schema.spec.name}'
                      spec:
                        accessModes: ["ReadWriteOnce"]
                        storageClassName: '${schema.spec.storageClass != "" ? schema.spec.storageClass : platformConfig.data.storageClass}'
                        resources:
                          requests:
                            storage: '${schema.spec.cacheSize}'

    # 2) Per-replica cache disks (READ-ONLY external collection). Kubernetes,
    #    not kro, creates these PVCs from the ephemeral volume template above;
    #    kro only lists them by label and reports on them (schema.status
    #    .cacheStorageClasses). The namespace is REQUIRED: a collection
    #    externalRef without one lists across every namespace. Nothing else in
    #    the graph depends on this collection, so an empty list (no pods yet)
    #    never blocks the Deployment.
    - id: modelCaches
      externalRef:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          namespace: '${schema.metadata.namespace}'
          selector:
            matchLabels:
              app: '${schema.spec.name}'

    # 3) Service: stable in-cluster endpoint for the model.
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: '${schema.spec.name}'
          labels:
            app: '${schema.spec.name}'
            genaiops.kro.run/service: '${schema.spec.name}'
        spec:
          selector:
            app: '${schema.spec.name}'
          ports:
            - name: http
              port: 80
              targetPort: 8000

    # 4) Monitoring wiring, included ONLY when spec.monitoring is true.
    #    kro's `includeWhen` means the developer's one boolean adds/removes a
    #    whole resource from the graph -- no separate manifest to maintain.
    - id: monitor
      includeWhen:
        - ${schema.spec.monitoring}
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}-metrics
          labels:
            app: '${schema.spec.name}'
            genaiops.kro.run/scrape: "true"
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8000"
            prometheus.io/path: "/metrics"
        spec:
          selector:
            app: '${schema.spec.name}'
          ports:
            - name: metrics
              port: 8000
              targetPort: 8000
